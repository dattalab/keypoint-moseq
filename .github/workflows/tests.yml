name: tests

# Pull requests test the oldest and newest supported Pythons. Pushes to main,
# the nightly run and manual runs test every supported Python, each in its
# own job. Every run resolves each dependency to its newest allowed release,
# so a breaking upstream release (including transitive ones) fails the
# nightly within a day. The installed versions are printed before pytest
# runs. The test suite runs on Linux; on macOS and Windows, every run installs
# keypoint-moseq and imports it, on the oldest and newest supported Pythons.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

# A new push to a pull request cancels that pull request's earlier run. Other
# events each get their own group, so no run on main is ever cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep both lists in step with PYTHON_VERSIONS in noxfile.py.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.10", "3.14"]' || '["3.10", "3.11", "3.12", "3.13", "3.14"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # versioneer derives the package version from tags

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false

      - name: Restore test data
        uses: actions/cache@v6
        with:
          path: ~/.cache/keypoint-moseq/open_field_2D.zip
          key: open-field-2d-22ec317b33039875cb21c76dca027017

      - name: Run tests
        run: uvx nox -s tests-${{ matrix.python }}

  # Installing from the checkout fails if a requirement has no wheels for the
  # platform, where an install from PyPI would fall back to an older release.
  install:
    name: install (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        # Keep in step with the oldest and newest of PYTHON_VERSIONS in
        # noxfile.py.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # versioneer derives the package version from tags

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false

      - name: Install and import
        run: uvx nox -s install-${{ matrix.python }}

  # The check that the repository requires before merging. It passes only
  # when every pytest and install job above passed, whichever Pythons this
  # run tested.
  tests:
    if: always()
    needs: [pytest, install]
    runs-on: ubuntu-latest
    steps:
      - name: Require every pytest and install job to pass
        run: |
          test "${{ needs.pytest.result }}" = success
          test "${{ needs.install.result }}" = success
