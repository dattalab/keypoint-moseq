[metadata]
name = keypoint-moseq
description = Unsupervised discovery of behavioral syllables from keypoint tracking data
long_description = file: README.md
long_description_content_type = text/markdown
author = Caleb Weinreb
author_email = calebsw@gmail.com
url = https://github.com/dattalab/keypoint-moseq
license = Non-Commercial Research and Academic Use Software License and Terms of Use
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
packages = find:
include_package_data = True
python_requires = >=3.10
install_requires =
    seaborn
    cytoolz
    matplotlib
    tqdm
    ipykernel
    imageio[ffmpeg]
    statsmodels
    pyyaml
    vidio
    holoviews[recommended]
    bokeh
    pandas
    tables
    panel
    networkx
    sleap_io
    pynwb
    ndx_pose
    plotly
    ipython_genutils
    tabulate
    commentjson
    packaging
    jax-moseq>=0.3.8
    joblib
    numpy
    ipywidgets
    ipympl
    jax
    jaxlib

[options.extras_require]
dev = 
    sphinx
    sphinx-rtd-theme
    autodocsumm
    myst-nb
    pytest

test =
    pytest
    pytest-regressions
    pooch

cuda =
    jax-moseq[cuda]

[options.package_data]
* = *.md

[tool:pytest]
testpaths = tests

[versioneer]
VCS = git
style = pep440
versionfile_source = keypoint_moseq/_version.py
versionfile_build = keypoint_moseq/_version.py
tag_prefix =
parentdir_prefix =
